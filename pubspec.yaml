name: pizzadelivery
description: my flutter pizza delivery app  
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.3.0
  bloc: ^9.1.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  cloudinary_flutter: ^1.3.0
  cloudinary_url_gen: ^1.0.0

  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.12.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  user_repository:
    path: packages/user_repository
  cart_repository:
    path: packages/cart_repository
  pizza_repository:
    path: packages/pizza_repository
  google_fonts: ^8.0.1
  flutter_slidable: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/